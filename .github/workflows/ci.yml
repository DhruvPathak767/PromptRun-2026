name: Continuous Integration & Quality Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Code Quality, Strict Types & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Linter Check (ESLint + Oxlint)
        run: npm run lint

      - name: Strict TypeScript Typecheck
        run: npm run typecheck

      - name: Run Test Suite (Vitest)
        run: npm run test

      - name: Production Bundle Build (Vite)
        run: npm run build
